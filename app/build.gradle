plugins { id 'com.android.application' }

// ---------------------------------------------------------------------------
// Binary resources (icons) are stored as Base64 text in src/main/binres and
// ad-block lists are downloaded at build time. Both end up in build/generated.
// ---------------------------------------------------------------------------
def genDir = new File(buildDir, 'generated/lasur')
def binDir = file('src/main/binres')

def filterLists = [
    'hosts.txt'              : 'https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts',
    'filters/easylist.txt'   : 'https://easylist.to/easylist/easylist.txt',
    'filters/advblock.txt'   : 'https://easylist-downloads.adblockplus.org/advblock.txt',
    'filters/adguard_ru.txt' : 'https://filters.adtidy.org/extension/ublock/filters/1.txt',
    'psl.dat'                : 'https://publicsuffix.org/list/public_suffix_list.dat',
]

tasks.register('decodeBinaries') {
    inputs.dir binDir
    outputs.dir new File(genDir, 'res')
    doLast {
        binDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.b64')) return
            def rel = binDir.toPath().relativize(f.toPath()).toString().replace('\\', '/').replaceAll(/\.b64$/, '')
            def out = new File(genDir, rel)
            out.parentFile.mkdirs()
            out.bytes = Base64.mimeDecoder.decode(f.text.trim())
        }
    }
}

tasks.register('downloadFilters') {
    outputs.dir new File(genDir, 'assets')
    doLast {
        def weekMs = 7L * 24 * 3600 * 1000
        filterLists.each { name, url ->
            def out = new File(genDir, "assets/$name")
            boolean fresh = out.exists() && out.length() > 10000 && System.currentTimeMillis() - out.lastModified() < weekMs
            if (fresh) return
            out.parentFile.mkdirs()
            Exception last = null
            for (int attempt = 0; attempt < 3 && !(out.exists() && System.currentTimeMillis() - out.lastModified() < 60000); attempt++) {
                try {
                    def c = new URL(url).openConnection()
                    c.setRequestProperty('User-Agent', 'Mozilla/5.0 (Lasur build)')
                    c.connectTimeout = 30000
                    c.readTimeout = 120000
                    byte[] data = c.inputStream.bytes
                    if (data.length < 10000) throw new IOException("only ${data.length} bytes")
                    out.bytes = data
                    logger.lifecycle("Downloaded $name (${out.length()} bytes)")
                    last = null
                } catch (Exception e) {
                    last = e
                    logger.warn("Could not download $name (attempt ${attempt + 1}): ${e.message}")
                }
            }
            // An APK without filter lists would silently ship without ad blocking: fail instead
            // (a stale copy from an earlier build is still accepted).
            if (last != null && !(out.exists() && out.length() > 10000)) {
                throw new GradleException("Filter list $name could not be downloaded from $url: ${last.message}")
            }
        }
    }
}

preBuild.dependsOn decodeBinaries, downloadFilters

android {
    namespace 'com.lumen.browser'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lumen.browser'
        minSdk 26
        targetSdk 36
        versionCode 29
        versionName '1.9.4'
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets {
        main {
            res.srcDirs += new File(genDir, 'res')
            assets.srcDirs += new File(genDir, 'assets')
        }
    }
    signingConfigs {
        release {
            // Provided by CI secrets (see README) or by a local keystore.properties-free env.
            def ks = System.getenv('SIGNING_KEYSTORE_FILE') ?: 'release.jks'
            def sp = System.getenv('SIGNING_STORE_PASSWORD'), ka = System.getenv('SIGNING_KEY_ALIAS')
            if (file(ks).exists() && sp && ka) {
                storeFile file(ks)
                storePassword sp
                keyAlias ka
                keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: sp
            } else if (file(ks).exists()) {
                logger.warn("Keystore $ks found but SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS are empty: using the debug key")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }
    applicationVariants.all { v ->
        v.outputs.all { outputFileName = "Lasur-${v.versionName}.apk" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    // Only for WebView features the framework API lacks: separate incognito profile (cookies/storage).
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
